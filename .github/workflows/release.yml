name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary_name: youtube-downloader.exe
            asset_name: youtube-downloader-windows-amd64.zip
          - os: macos-latest
            goos: darwin
            goarch: amd64
            binary_name: youtube-downloader
            asset_name: youtube-downloader-macos-amd64.tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary_name: youtube-downloader
            asset_name: youtube-downloader-macos-arm64.tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary_name: youtube-downloader
            asset_name: youtube-downloader-linux-amd64.tar.gz
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary_name: youtube-downloader
            asset_name: youtube-downloader-linux-arm64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test ./apps/mvd-cli/... ./libs/...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.binary_name }} ./apps/mvd-cli

      - name: Package Windows Asset
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          Compress-Archive -Path ${{ matrix.binary_name }}, README.md, assets -DestinationPath ${{ matrix.asset_name }}

      - name: Package Unix Asset
        if: matrix.goos != 'windows'
        run: |
          chmod +x ${{ matrix.binary_name }}
          tar -czvf ${{ matrix.asset_name }} ${{ matrix.binary_name }} README.md assets

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
