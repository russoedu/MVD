name: regen-lock
on:
  push:
    branches: [claude/npm-deps-bump]
    paths: [.github/workflows/regen-lock.yml]
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@11
      - run: npm --version
      - run: rm package-lock.json && npm install --package-lock-only --ignore-scripts
      - run: npm ci --dry-run --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
