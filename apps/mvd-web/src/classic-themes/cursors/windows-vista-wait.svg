    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff"/>
      <stop offset="0.45" stop-color="#36aef0"/>
      <stop offset="1" stop-color="#0b4f9c"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#06305e" stroke-width="7" opacity="0.4"/>
